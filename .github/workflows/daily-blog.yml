name: Daily SEO Blog Post

on:
  schedule:
    # 06:00 EAT (UTC+3) daily
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate blog post
        id: generate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Verify build
        run: npm run build

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- src/lib/blogData.ts src/lib/blogContent.tsx public/sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "kenyaadverts-bot"
          git config user.email "hydrocephcare@gmail.com"
          git add src/lib/blogData.ts src/lib/blogContent.tsx public/sitemap.xml
          git commit -m "Auto-generate daily blog post

Generated by the Groq-powered daily blog workflow. Validated for
length and structure before commit (see scripts/generate-blog-post.mjs)."
          git push
